# DURU KOREAN — a blog post as a PDF
#
# On demand (scripts/blog-pdf.mjs): one A4 PDF per language the post can
# be read in, uploaded to the private `resources` bucket and recorded in
# posts.pdf, so the post's page offers "Download PDF" to signed-in
# readers. A copy of every file goes to the rework-output branch under
# blog-pdf/<run number>/ for checking. Publishes nothing: a draft stays
# a draft.

name: Blog post PDF

on:
  workflow_dispatch:
    inputs:
      find:
        description: 'Part of the post title or slug (Korean or English)'
        type: string
        default: 'lump sum'
      langs:
        description: 'Languages (empty = all ten)'
        type: string
        default: ''
      dry_run:
        description: 'Make the files only; upload nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Open the rework-output branch
        run: |
          git config user.name "duru-korean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin rework-output
          git worktree add ../rework-output origin/rework-output -B rework-output

      - name: Make the PDFs
        env:
          # Through the environment, never pasted into the command line.
          FIND: ${{ inputs.find }}
          LANGS: ${{ inputs.langs }}
          DRY: ${{ inputs.dry_run }}
          RUN: ${{ github.run_number }}
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -- --find="$FIND" --out="../rework-output/blog-pdf/$RUN"
          if [ -n "$LANGS" ]; then set -- "$@" --langs="$LANGS"; fi
          if [ "$DRY" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/blog-pdf.mjs "$@"

      - name: Save
        if: always()
        working-directory: ../rework-output
        env:
          RUN: ${{ github.run_number }}
        run: |
          git add -A blog-pdf
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Blog post PDFs (run $RUN)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin rework-output && git push -q origin rework-output && exit 0
            sleep $((2 ** i))
          done
          exit 1
