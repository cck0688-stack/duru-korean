# DURU KOREAN — the day's worksheets
#
# Writes worksheets, renders them to PDF in eight languages and leaves
# them in the private bucket for a person to approve. It publishes
# nothing: the database refuses to publish anything that a human admin
# has not approved and whose sources a human admin has not cleared.
# See supabase/schema.sql §36f.
#
# Runs here rather than on Vercel for the same reason the blog's run
# does — writing and rendering a day's sheets takes minutes and a
# Hobby function is cut off at sixty seconds. It also needs a browser,
# which a serverless function has not got.
#
# Secrets to set at Settings → Secrets and variables → Actions:
#
#   DURU_BOT_EMAIL      a Supabase account that is in admin_users
#   DURU_BOT_PASSWORD
#   OPENAI_API_KEY      (or ANTHROPIC_API_KEY, or GOOGLE_API_KEY)
#
# The same bot account the blog's run uses. It is an ordinary account
# rather than the service_role key, so that if these secrets ever leak
# what leaks is an account that can write drafts — not a key that reads
# every row in the database.
#
#   CLAUDE_CODE_OAUTH_TOKEN  optional. When set, the sheets are written,
#                       reviewed and translated on the owner's Claude
#                       subscription instead of OPENAI_API_KEY — no
#                       per-call bill, the plan's usage allowance instead.
#                       Made once with `claude setup-token`. See
#                       scripts/lib/claude-code.mjs.
#
# Optional variables: TRANSLATE_PROVIDER, TRANSLATE_MODEL,
# TRANSLATE_FAST_MODEL, SHEET_MODEL (the model that writes and reviews;
# gpt-5 on OpenAI unless set).

name: Daily worksheets

on:
  schedule:
    # 16:00 UTC is 01:00 the next morning in Seoul (the owner, 2026-10-06:
    # it was 04:00, and ran three to four hours late). GitHub's scheduler
    # runs late when it is busy, which is harmless here: the run reads
    # what is already on the shelf rather than the date, so a late
    # start, a missed day or a half-finished run leaves no hole that
    # the next one does not fill.
    # Off while the first series runs (owner, 2026-10-09: all 300 by
    # 10-15); put back when it is done.
    # - cron: '0 16 * * *'
    # The first series (the owner, 2026-10-09: 100 each of hangul, grammar
    # and vocab by 10-15, without a break): a run every two hours, those
    # shelves only. A run stops starting sheets after five hours
    # (DURU_TIME_BUDGET_MIN); while one runs, the next waits in the
    # concurrency queue, so they follow each other back to back.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Write nothing, just print what would be saved'
        type: boolean
        default: false
      only:
        description: 'Only these shelves, comma separated (e.g. vocab,reading)'
        type: string
        default: ''
      count:
        description: 'How many per shelf (default: grammar 2, vocab 2, reading 1, reallife 1)'
        type: string
        default: ''
      force:
        description: 'Make them even if this shelf already has its sheets today (Seoul date)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# The rework run (rework-sheets.yml) and this one share the model
# account; one waits for the other instead of both running at once.
concurrency:
  group: rework-sheets
  cancel-in-progress: false

jobs:
  sheets:
    runs-on: ubuntu-latest
    # One job per shelf. Six sheets a day from the syllabus (the owner,
    # 2026-10-06; content/curriculum, scripts/lib/curriculum.mjs):
    # grammar 2, vocab 2, reading 1, reallife 1, every day.
    # hangul and etc run only when a dispatch names them. A shelf that
    # fails takes only itself down. The subjects cannot collide, because
    # each job writes for one shelf and keeps its own plan file.
    strategy:
      fail-fast: false
      matrix:
        shelf: [vocab, reading, grammar, reallife, hangul, etc]
    concurrency:
      group: daily-worksheets-${{ matrix.shelf }}
      cancel-in-progress: false
    # A sheet is written, reviewed, possibly rewritten, translated and
    # rendered ten times. The limit leaves room for a wait on the
    # subscription's session limit (CLAUDE_LIMIT_WAIT_MIN) before it.
    timeout-minutes: 360
    steps:
      # Whether this shelf writes today — decided first, so a shelf that
      # does not installs nothing.
      - name: Is this shelf on today
        id: today
        env:
          ONLY: ${{ github.event.schedule == '0 */2 * * *' && 'grammar,vocab,hangul' || inputs.only }}
          SHELF: ${{ matrix.shelf }}
          # Seoul dates the daily run makes nothing (the owner's call).
          # 2026-09-28: no allowance that morning; one sheet was made
          # the evening before instead. 2026-10-01 to 10-04: a week off
          # to save the allowance (owner, 2026-09-30).
          SKIP_DATES: '2026-09-28 2026-10-01 2026-10-02 2026-10-03 2026-10-04'
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          run=true
          if [ -n "$ONLY" ]; then
            # A dispatch that names shelves runs only those.
            echo ",$ONLY," | tr -d ' ' | grep -q ",$SHELF," || run=false
          else
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && echo " $SKIP_DATES " | grep -q " $today "; then run=false; fi
            case "$SHELF" in
              grammar|vocab|reading|reallife|hangul) ;;
              *) run=false ;;
            esac
          fi
          echo "$SHELF on $today: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.today.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.today.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - if: steps.today.outputs.run == 'true'
        run: npm ci

      # Only Chromium, and only its own dependencies. The renderer
      # needs a browser; it does not need three of them.
      - name: Install the browser that renders the PDFs
        if: steps.today.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # The Claude Code command line, for when the subscription writes.
      - name: Install Claude Code
        if: steps.today.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write the worksheets (${{ matrix.shelf }})
        if: steps.today.outputs.run == 'true'
        env:
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          TRANSLATE_FAST_MODEL: ${{ vars.TRANSLATE_FAST_MODEL }}
          SHEET_MODEL: ${{ vars.SHEET_MODEL }}
          SHEET_PROVIDER: ${{ vars.SHEET_PROVIDER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A session limit is waited out, up to five hours (lib/claude-code.mjs).
          CLAUDE_LIMIT_WAIT_MIN: '300'
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Through the environment, never interpolated into the command
          # line: a ${{ }} inside `run:` is pasted into the shell before
          # bash sees it, so a dispatch input would be shell, not an
          # argument. Only someone with write access can dispatch this,
          # but that is not a reason to hand them a shell.
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
          COUNT: ${{ github.event.schedule == '0 */2 * * *' && '40' || inputs.count }}
          FORCE: ${{ github.event.schedule == '0 */2 * * *' || inputs.force }}
          DURU_TIME_BUDGET_MIN: '290'
          SHELF: ${{ matrix.shelf }}
        run: |
          args=(--only="$SHELF")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # A day's number per shelf (the owner, 2026-10-06): two grammar,
          # two vocab, one each of the others; a dispatch's count wins.
          if [ -z "$COUNT" ]; then
            case "$SHELF" in grammar|vocab|hangul) COUNT=2 ;; *) COUNT=1 ;; esac
          fi
          args+=(--count="$COUNT")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/generate-sheets.mjs "${args[@]}"

      # What readers see on the download's page, beside the PDFs on
      # rework-output (read/<id>/<lang>.json); the page reads it from
      # there until the site carries it itself. Kept even when a shelf
      # failed, for the sheets it did save.
      - name: Keep the read-online files
        if: always() && steps.today.outputs.run == 'true'
        env:
          SHELF: ${{ matrix.shelf }}
        run: |
          [ -d read-output ] || exit 0
          git config user.name "duru-korean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin rework-output
          git worktree add ../rework-output origin/rework-output -B rework-output
          mkdir -p ../rework-output/read
          cp -r read-output/. ../rework-output/read/
          cd ../rework-output
          git add -A read
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Read-online files ($SHELF)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin rework-output && git push -q origin rework-output && exit 0
            sleep $((2 ** i))
          done
          exit 1

  # The series runs back to back (the owner, 2026-10-09: all 300 by
  # 10-15): when a series run ends, it starts the next one (the cron
  # alone left a gap — 10:00 UTC never fired). A run that ended within
  # 30 minutes did nothing (every shelf has its 100), so the chain stops.
  next:
    needs: sheets
    if: always() && (github.event.schedule == '0 */2 * * *' || inputs.only == 'grammar,vocab,hangul')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          took=$(( ($(date +%s) - $(date -d "$started" +%s)) / 60 ))
          echo "this run took $took minutes"
          if [ "$took" -lt 30 ]; then echo "nothing left to make; the chain stops"; exit 0; fi
          gh workflow run daily-sheets.yml --repo "$REPO" --ref "$REF" \
            -f only=grammar,vocab,hangul -f count=40 -f force=true
