# DURU KOREAN — the morning's seven drafts
#
# Runs here rather than on Vercel because writing seven articles takes
# minutes and a Vercel Hobby function is cut off at sixty seconds.
# Nothing this job does is public: it signs in as an ordinary admin
# account and leaves seven unpublished drafts for a person to read.
# Each is translated into the other seven languages before it is
# saved, so approving one is a click rather than an afternoon.
#
# Secrets to set at Settings → Secrets and variables → Actions:
#
#   DURU_BOT_EMAIL      a Supabase account that is in admin_users
#   DURU_BOT_PASSWORD
#   OPENAI_API_KEY      (or ANTHROPIC_API_KEY, or GOOGLE_API_KEY)
#   UNSPLASH_ACCESS_KEY (or PEXELS_API_KEY) — for the photographs.
#                       Both are free. Without one the posts are
#                       written without a picture.
#
# Optional variables: TRANSLATE_PROVIDER, TRANSLATE_MODEL, PHOTO_PROVIDER.

name: Daily blog drafts

on:
  schedule:
    # 19:00 UTC is 04:00 the next morning in Seoul (the owner's choice),
    # the same hour as the worksheets. GitHub's scheduler can run late
    # when it is busy; the job claims the day by its Seoul date, so a
    # late start still files under the right day and a double start
    # writes nothing twice.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Write nothing, just print what would be saved'
        type: boolean
        default: false
      only:
        description: 'Only these categories, comma separated (e.g. travel,dining)'
        type: string
        default: ''

concurrency:
  group: daily-blog-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    # Seven posts, each written, checked, illustrated and then
    # translated into seven languages. Comfortably under an hour;
    # the limit is here so a hung provider call cannot run all day.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The Claude Code command line, for when the subscription writes.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write the drafts
        env:
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The owner's Claude subscription, when set: the text is written there
          # instead of on the API key (scripts/lib/claude-code.mjs).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PHOTO_PROVIDER: ${{ vars.PHOTO_PROVIDER }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          # Same names keep-alive.yml already uses. Unset is fine —
          # the script falls back to this project's public values.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Through the environment, never interpolated into the command
          # line: a ${{ }} inside `run:` is pasted into the shell before
          # bash sees it, so a dispatch input would be shell, not an
          # argument. Only someone with write access can dispatch this,
          # but that is not a reason to hand them a shell.
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY" ]; then args+=(--only="$ONLY"); fi
          node scripts/generate-drafts.mjs "${args[@]}"
