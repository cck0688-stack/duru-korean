# DURU KOREAN — the owner's edited sheets, in every language
#
# On demand (scripts/adopt-edits.mjs). The owner (2026-10-11) edited the 100
# Hangul Starter and 102 Grammar Cheat Sheets by hand and asked for them in
# every language, held for his Publish. English is his PDF; the other
# languages are the stored text set again in his layout. dry_run (default)
# builds and checks everything and writes nothing.

name: Adopt the owner's edits (all languages)

on:
  workflow_dispatch:
    inputs:
      shelf:
        description: 'hangul or grammar'
        default: 'hangul'
      dry_run:
        description: 'Build and check only; change nothing'
        type: boolean
        default: true
      only:
        description: 'Only these numbers (e.g. 050 or 002,026,029)'
        default: ''
      read_only:
        description: 'Only write the read-online text (no PDFs rendered or replaced)'
        type: boolean
        default: false
      keep_pdfs:
        description: 'Also keep the built PDFs as a download (for the owner to look at)'
        type: boolean
        default: false
      from:
        description: 'First number (e.g. 001) — a range keeps one run under six hours'
        default: ''
      to:
        description: 'Last number (e.g. 034)'
        default: ''

permissions:
  contents: write

concurrency:
  group: adopt-edits-${{ inputs.shelf }}-${{ inputs.from }}-${{ inputs.only }}
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: pip install --quiet pymupdf fonttools
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code

      - name: The list, and the sheets' stored text
        run: |
          git config user.name "duru-korean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin rework-output
          git worktree add ../rework-output origin/rework-output -B rework-output
          cp ../rework-output/series-zip/index.csv /tmp/index.csv

      - name: The owner's grammar PDFs
        if: inputs.shelf == 'grammar'
        run: |
          curl -sS -L -o /tmp/g.zip "https://drive.usercontent.google.com/download?id=1KGycPvWHohZP62_HSKjLw_95X6Vl6QrX&export=download&confirm=t"
          mkdir -p /tmp/g && unzip -q /tmp/g.zip -d /tmp/g
          ls /tmp/g/*/ | head -3

      - name: Adopt
        env:
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_LIMIT_WAIT_MIN: '300'
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          SHELF: ${{ inputs.shelf }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
          FROM: ${{ inputs.from }}
          READ_ONLY: ${{ inputs.read_only }}
          KEEP_PDFS: ${{ inputs.keep_pdfs }}
          TO: ${{ inputs.to }}
        run: |
          args=(--shelf="$SHELF" --index=/tmp/index.csv --read=../rework-output/read)
          if [ "$SHELF" = "hangul" ]; then
            args+=(--ids=content/edited/hangul-starter-drive-ids.json --content-only=008,009,017,028,031,032,033,035,054,058,062,065,067,068,082,085 --read-out=read-output)
          else
            args+=(--dir=/tmp/g/Grammar-Cheat-Sheets-aligned)
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY" ]; then args+=(--only="$ONLY"); fi
          if [ "$KEEP_PDFS" = "true" ]; then args+=(--out=pdf-out); fi
          if [ "$READ_ONLY" = "true" ]; then args+=(--read-only); fi
          if [ -n "$FROM" ]; then args+=(--from="$FROM"); fi
          if [ -n "$TO" ]; then args+=(--to="$TO"); fi
          node scripts/adopt-edits.mjs "${args[@]}"

      - name: The built PDFs, to look at
        if: always() && inputs.keep_pdfs == true
        uses: actions/upload-artifact@v4
        with:
          name: adopt-pdfs-${{ inputs.shelf }}
          path: pdf-out/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the new read-online text
        if: always() && inputs.shelf == 'hangul' && inputs.dry_run != true
        run: |
          [ -d read-output ] || exit 0
          cp -r read-output/. ../rework-output/read/
          cd ../rework-output
          git add -A read
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Read-online text for the owner's edited Hangul Starter sheets"
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin rework-output && git push -q origin rework-output && exit 0
            sleep $((2 ** i))
          done
          exit 1
