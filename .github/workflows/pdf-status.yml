# DURU KOREAN — read-only: how many blog posts have every PDF, and which are missing (owner, 2026-11-06).
name: Blog PDF status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Count
        env:
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "## 블로그 PDF 현황"
            echo '```'
            node scripts/blog-pdf.mjs --status
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
