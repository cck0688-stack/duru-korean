# DURU KOREAN — storage clean-up (owner, 2026-11-11): the duplicate draft copies of published worksheet files.
# Report only unless `delete` is ticked. See scripts/storage-cleanup.mjs.
name: Storage clean-up
on:
  schedule:
    # Owner, 2026-11-11: once a day, the drafts of worksheet files that are published and identical to
    # their public copy are removed (each published file would otherwise be stored twice).
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      delete:
        description: 'Really delete the verified duplicate drafts'
        type: boolean
        default: false
      check_cleaned:
        description: 'Only check that the public copies of the cleaned files are still there'
        type: boolean
        default: false
      verify:
        description: 'Compare the bytes of both copies before counting a draft as a duplicate'
        type: boolean
        default: true
      limit:
        description: 'Look at the first N rows only (empty = all)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: storage-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean up
        # A day the clean-up cannot run is not an alarm: the next one does the same work.
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          DEL: ${{ inputs.delete }}
          CHECK: ${{ inputs.check_cleaned }}
          VERIFY: ${{ inputs.verify }}
          LIMIT: ${{ inputs.limit }}
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          args=()
          # The scheduled run always verifies the bytes and deletes; a hand run does what its boxes say.
          if [ "$EVENT" = "schedule" ]; then DEL=true; VERIFY=true; CHECK=false; fi
          if [ "$DEL" = "true" ]; then args+=(--delete); fi
          if [ "$CHECK" = "true" ]; then args+=(--check-cleaned); fi
          if [ "$VERIFY" = "true" ]; then args+=(--verify); fi
          if [ -n "$LIMIT" ]; then args+=(--limit="$LIMIT"); fi
          node scripts/storage-cleanup.mjs "${args[@]}"
