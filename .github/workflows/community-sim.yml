# DURU KOREAN — Community simulation
#
# Invented members who write in the site's eight languages. Three jobs:
#
#   live         every twenty minutes: sample writers post, reply and
#                heart on the REAL Community, through the bot account.
#                Every row is marked is_sample (a star admins alone
#                see); sample writers only talk among themselves.
#   verify-live  every day at 06:50 Seoul time: the check that the
#                multilingual Community does its job, on the live site's
#                sample threads (scripts/sim/verify-live.mjs). It only
#                reads; its report is on the run's summary page and a
#                download.
#   sim          the old separate TEST project (sign-ups included). Off
#                unless the variable SIM_TEST is "on" and the TEST
#                secrets still point at a project; see scripts/sim/lib.mjs
#                for the two locks that keep it off the live project.
#
# ── On and off ────────────────────────────────────────────────────
#
# Nothing runs until the repository variable SIM_ENABLED is "true"
# (Settings → Secrets and variables → Actions → Variables). Setting it
# to anything else — or deleting it — stops every job at once. That is
# the stop button. SIM_LIVE = off stops only the live writing.
# To remove every sample post: `delete from public.stories where is_sample;`
#
# ── Secrets (Settings → Secrets and variables → Actions → Secrets) ─
#
#   SUPABASE_URL, SUPABASE_ANON_KEY     the live project (already set)
#   DURU_BOT_EMAIL, DURU_BOT_PASSWORD   the bot account (already set)
#   OPENAI_API_KEY / CLAUDE_CODE_OAUTH_TOKEN   for the writing
#
#   Only for the test project (sim job, SIM_TEST = on):
#   SIM_SUPABASE_URL, SIM_SUPABASE_ANON_KEY, SIM_PASSWORD_SECRET,
#   SIM_TRANSLATE_CACHE_SECRET

name: Community simulation

on:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '50 21 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        options: [live, verify, both, test-tick, test-verify]
        default: live

concurrency:
  group: community-sim
  cancel-in-progress: false

jobs:
  sim:
    if: vars.SIM_ENABLED == 'true' && vars.SIM_TEST == 'on' && (github.event_name == 'schedule' || inputs.task == 'test-tick' || inputs.task == 'test-verify')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIM_SUPABASE_URL: ${{ secrets.SIM_SUPABASE_URL }}
      SIM_SUPABASE_ANON_KEY: ${{ secrets.SIM_SUPABASE_ANON_KEY }}
      SIM_PASSWORD_SECRET: ${{ secrets.SIM_PASSWORD_SECRET }}
      SIM_TRANSLATE_CACHE_SECRET: ${{ secrets.SIM_TRANSLATE_CACHE_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # The owner's Claude subscription, when set: the text is written there
      # instead of on the API key (scripts/lib/claude-code.mjs).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
      # Which part: set through the environment, never pasted into the
      # command line.
      EVENT: ${{ github.event_name }}
      CRON: ${{ github.event.schedule }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The Claude Code command line, for when the subscription writes.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Decide
        id: what
        run: |
          tick=false; verify=false
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "50 21 * * *" ]; then verify=true; else tick=true; fi
          else
            case "$TASK" in
              test-tick) tick=true ;;
              test-verify) verify=true ;;
            esac
          fi
          echo "tick=$tick" >> "$GITHUB_OUTPUT"
          echo "verify=$verify" >> "$GITHUB_OUTPUT"

      - name: Tick
        if: steps.what.outputs.tick == 'true'
        run: node scripts/sim/run.mjs tick

      - name: Install the browser for the verification
        if: steps.what.outputs.verify == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify
        if: steps.what.outputs.verify == 'true'
        run: |
          set +e
          node scripts/sim/verify.mjs
          code=$?
          [ -f sim-report.md ] && cat sim-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Keep the report
        if: always() && steps.what.outputs.verify == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: community-sim-report
          path: |
            sim-report.md
            sim-report.json
            sim-shots/
          if-no-files-found: ignore

  live:
    if: vars.SIM_ENABLED == 'true' && vars.SIM_LIVE != 'off' && (github.event_name != 'schedule' || github.event.schedule != '50 21 * * *') && (github.event_name != 'workflow_dispatch' || inputs.task == 'live' || inputs.task == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: community-sim-live
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
      DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Sample posts on the live Community
        run: node scripts/sim/live.mjs

  verify-live:
    if: vars.SIM_ENABLED == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '50 21 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'verify' || inputs.task == 'both')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
      DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the browser for the verification
        run: npx playwright install --with-deps chromium

      - name: Verify on the live site
        run: |
          set +e
          node scripts/sim/verify-live.mjs
          code=$?
          [ -f sim-report.md ] && cat sim-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-live-report
          path: |
            sim-report.md
            sim-report.json
            sim-shots/
          if-no-files-found: ignore
