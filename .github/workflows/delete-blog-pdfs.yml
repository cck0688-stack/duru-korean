# DURU KOREAN — remove every blog PDF from storage (owner, 2026-11-11), after the backup was downloaded.
name: Delete blog PDFs
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Really delete (otherwise only count)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove
        env:
          DEL: ${{ inputs.delete }}
          DURU_BOT_EMAIL: ${{ secrets.DURU_BOT_EMAIL }}
          DURU_BOT_PASSWORD: ${{ secrets.DURU_BOT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          args=()
          if [ "$DEL" = "true" ]; then args+=(--delete); fi
          node scripts/delete-blog-pdfs.mjs "${args[@]}"
