<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="Admin review queue for generated worksheets.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme-v2.css">
</head>
<body class="theme-v2">

<header class="site-header">
  <div class="wrap">
    <div class="header-brand">
      <a href="index.html" class="logo">
        <img class="logo-img" src="assets/logo.webp" alt="Duru Korean" width="1617" height="280">
      </a>
      <span class="site-visits" hidden>
        <span><span data-i18n="visits.total" data-visits-total-label>Visits</span> <b data-visits-total>–</b></span>
        <span><span data-i18n="visits.today" data-visits-today-label>Today</span> <b data-visits-today>–</b></span>
      </span>
    </div>
    <nav class="nav-main">
      <a href="learning-korean.html" data-i18n="nav.learnKorean">Learn Korean</a>
      <a href="book-resources.html" data-i18n="nav.bookResources">Book Resources</a>
      <a href="free-resources.html" data-i18n="nav.freeResources">Free Downloads</a>
      <a href="blog.html" data-i18n="nav.blog">Blog</a>
      <a href="stories.html" data-i18n="nav.stories">Community</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switcher" id="langSwitcher"></div>
      <button id="authTrigger" class="btn-login" type="button" data-i18n="nav.login">Log in</button>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span></button>
    </div>
  </div>
</header>

<div id="adminNotAuthorized" class="page-hero" hidden>
  <div class="wrap">
    <h1 data-i18n="admin.notAuthorized">Not Authorized</h1>
    <p data-i18n="admin.notAuthorizedDesc">You don't have access to this page.</p>
  </div>
</div>

<div id="adminContent" hidden>
  <section class="page-hero">
    <div class="wrap">
      <h1 data-i18n="adminInbox.title">Waiting for your approval</h1>
      <div class="page-hero-rule"></div>
      <p class="page-hero-tagline" data-i18n="adminInbox.tagline">Everything that is not public yet, in one place. Read it here, then publish.</p>
    </div>
  </section>

  <section class="section section-after-hero">
    <div class="wrap">
      <div class="inbox-tabs" role="tablist">
        <button type="button" class="inbox-tab is-on" data-tab="res" role="tab"><span data-i18n="adminInbox.tabDownloads">Downloads</span> <b id="inboxCountRes">–</b></button>
        <button type="button" class="inbox-tab" data-tab="post" role="tab"><span data-i18n="adminInbox.tabBlog">Blog posts</span> <b id="inboxCountPost">–</b></button>
        <button type="button" class="btn btn-ghost inbox-refresh" id="inboxRefresh" data-i18n="review.refresh">Refresh</button>
      </div>
      <div class="inbox-filters" id="inboxFilters" hidden></div>
      <div class="inbox-bar">
        <label class="inbox-all"><input type="checkbox" id="inboxAll"> <span data-i18n="adminInbox.selectAll">Select all shown</span></label>
        <button type="button" class="btn btn-primary" id="inboxPublishSel" disabled><span data-i18n="adminInbox.publishSelected">Publish selected</span> <span id="inboxSelN"></span></button>
        <span class="inbox-bar-msg" id="inboxBarMsg" role="status"></span>
      </div>
      <div class="review-empty" id="inboxEmpty" hidden><p data-i18n="adminInbox.nothing">Nothing is waiting for you.</p></div>
      <div id="inboxList"></div>
    </div>
  </section>
</div>

<script src="js/main.js"></script>

<script src="js/i18n.js"></script>
</body>
</html>
