<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Results — Duru Korean</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
  <div class="wrap">
    <div class="header-brand">
      <a href="index.html" class="logo">
        <img class="logo-img" src="assets/logo.webp" alt="Duru Korean" width="1617" height="280">
      </a>
      <span class="site-visits" hidden>
        <span><span data-i18n="visits.total" data-visits-total-label>Visits</span> <b data-visits-total>–</b></span>
        <span><span data-i18n="visits.today" data-visits-today-label>Today</span> <b data-visits-today>–</b></span>
      </span>
    </div>
    <nav class="nav-main">
      <a href="learning-korean.html" data-i18n="nav.learnKorean">Learn Korean</a>
      <a href="book-resources.html" data-i18n="nav.bookResources">Book Resources</a>
      <a href="free-resources.html" data-i18n="nav.freeResources">Free Downloads</a>
      <a href="blog.html" data-i18n="nav.blog">Blog</a>
      <a href="stories.html" data-i18n="nav.stories">Guestbook</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switcher" id="langSwitcher"></div>
      <button id="authTrigger" class="btn-login" type="button" data-i18n="nav.login">Log in</button>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span></button>
    </div>
  </div>
</header>

    <main>
      <section class="page-hero" style="background: linear-gradient(135deg, #d8ccbc 0%, #e8e0d0 100%);">
        <div class="wrap">
          <h1 data-i18n="search.title">Search Results</h1>
          <p class="subtitle" data-i18n="search.subtitle">Find blog posts, stories, and resources</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="search-container">
            <div class="search-box">
              <input type="text" id="searchInput" class="search-input" placeholder="Search..." data-i18n="search.placeholder" aria-label="Search">
              <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </div>
            <div id="searchFilters" class="search-filters">
              <button class="search-filter-btn active" data-filter="all" data-i18n="search.filterAll">All</button>
              <button class="search-filter-btn" data-filter="blog" data-i18n="search.filterBlog">Blog</button>
              <button class="search-filter-btn" data-filter="stories" data-i18n="search.filterStories">Stories</button>
              <button class="search-filter-btn" data-filter="resources" data-i18n="search.filterResources">Resources</button>
            </div>
          </div>

          <div id="searchResults" class="search-results"></div>
          <div id="searchEmpty" class="search-empty" hidden>
            <p data-i18n="search.noResults">No results found. Try different keywords.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>&copy; <span data-year></span> Duru Korean. All rights reserved.</p>
        <div class="footer-links">
          <a href="about.html" data-i18n="footer.about">About</a>
          <a href="privacy.html" data-i18n="footer.privacy">Privacy</a>
          <a href="terms.html" data-i18n="footer.terms">Terms</a>
          <a href="https://mail.google.com/mail/?view=cm&amp;to=cck0688%40gmail.com" target="_blank" rel="noopener" data-i18n="footer.contact">Contact</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
<script src="js/notify-feed.js"></script>
  <script src="js/visitor-tracking.js"></script>
  <script src="js/main.js"></script>
<script src="js/blog-categories.js"></script>
  <script src="js/search.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
